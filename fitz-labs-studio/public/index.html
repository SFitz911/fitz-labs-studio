<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitz Labs AI Video Generator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#070A11; --panel:#0E131F; --raise:#161D2E; --line:#222C44; --line2:#31406180;
  --text:#E8EDF8; --mute:#8794B0;
  --create:#4FE3C9; --edit:#FFA24A; --video:#A98BFF; --sound:#FF5C8D; --lib:#7FA8FF;
  --acc:var(--create);
  --display:"Chakra Petch","Avenir Next Condensed","Trebuchet MS",sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--ink);color:var(--text);font:15px/1.45 var(--body);
  display:grid;grid-template:"top top top" auto "rail stage dock" minmax(0,1fr) / 196px minmax(0,1.2fr) minmax(300px,.8fr)}
body[data-mode=edit]{--acc:var(--edit)} body[data-mode=video]{--acc:var(--video)}
body[data-mode=sound]{--acc:var(--sound)} body[data-mode=lib]{--acc:var(--lib)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.01em}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font:700 17px/1 var(--display);display:block}
.brand small{color:var(--mute);font-size:11.5px;display:block;margin-top:3px}
.proj{flex:1;min-width:60px;text-align:center}
.proj input{width:100%;max-width:260px;text-align:center;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-weight:600}
.proj input:hover,.proj input:focus{border-color:var(--line)}
.credits{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:6px 10px;min-width:124px;text-align:left}
.credits span{font-size:11px;color:var(--mute);display:block}
.credits b{font:600 15px/1.2 var(--display)}
.meter{height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);transition:width .4s}

/* rail */
.rail{grid-area:rail;border-right:1px solid var(--line);background:var(--panel);padding:14px 10px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.rail p{margin:14px 8px 4px;font-size:12px;color:var(--mute)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;border:1px solid transparent;background:none;text-align:left;font-weight:500;color:var(--mute);white-space:nowrap}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{color:var(--text);background:var(--raise)}
.nav.mode{border-color:var(--line);color:var(--text)}
.nav[aria-current=page]{color:var(--ink);background:var(--c);border-color:var(--c);font-weight:700;box-shadow:0 0 22px -6px var(--c)}
.nav.libn[aria-current=page]{color:var(--text);background:var(--raise);border-color:var(--line2);box-shadow:none}

/* stage */
.stage{grid-area:stage;overflow:auto;padding:18px;position:relative;
  background:radial-gradient(900px 380px at 50% -140px,color-mix(in srgb,var(--acc) 13%,transparent),transparent 70%)}
.stage::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.7}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hero{text-align:center;padding:7vh 0 2vh}
.hero h1{font-size:clamp(24px,3.4vw,34px);font-weight:600}
.hero p{color:var(--mute);margin:8px auto 0;max-width:46ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.composer{border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:10px;display:flex;gap:10px;align-items:stretch}
.composer:focus-within{border-color:var(--acc)}
textarea,input[type=text]{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;resize:vertical}
.composer textarea{background:none;border:0;min-height:74px;padding:6px 8px;resize:none}
.composer textarea:focus{outline:none}
.go{flex:none;min-width:104px;border:0;border-radius:12px;background:var(--acc);color:var(--ink);font:700 15px var(--display);padding:10px 14px;box-shadow:0 0 28px -8px var(--acc)}
.go small{display:block;font:600 12px var(--body);opacity:.75;margin-top:2px}
.go:disabled{opacity:.55;cursor:progress}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrls label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
select{background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:7px 10px;max-width:190px}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:9px;padding:7px 12px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.btn.danger:hover{border-color:#ff6b6b;color:#ff9c9c}
.switch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;font-size:14px}
.switch i{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text);transition:transform .2s}
.switch[aria-pressed=true] i{background:var(--acc)} .switch[aria-pressed=true] i::after{transform:translateX(12px);background:var(--ink)}
.switch:disabled{opacity:.5;cursor:not-allowed}
.note{color:var(--mute);font-size:13px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--mute)}
.chip:hover,.chip[aria-pressed=true]{color:var(--text);border-color:var(--acc)}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--acc) 16%,transparent)}

/* chat */
.thread{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding:4px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--raise);border:1px solid var(--line)}
.msg.assistant{align-self:flex-start;color:color-mix(in srgb,var(--acc) 70%,var(--text));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));background:var(--panel)}
.msg .row{margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* edit */
.canvas{background:#05070c;border:1px dashed var(--line2);border-radius:14px;min-height:260px;display:grid;place-items:center;padding:12px;text-align:center}
.canvas img{max-width:100%;max-height:52vh;border-radius:8px;outline:1px solid var(--acc);outline-offset:3px}
.refs{display:flex;gap:8px}
.ref{width:58px;aspect-ratio:3/4;border:1px dashed var(--line2);border-radius:8px;overflow:hidden;display:grid;place-items:center;color:var(--mute);background:none;padding:0}
.ref img{width:100%;height:100%;object-fit:cover}

/* dock + tiles */
.dock{grid-area:dock;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.dock h2,.sec{font:600 14px var(--display);color:var(--mute);display:flex;align-items:center;gap:10px;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.tile{position:relative;aspect-ratio:3/4;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--raise);padding:0;display:block;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile:hover{border-color:var(--acc)}
.tile .tag{position:absolute;left:5px;bottom:5px;font-size:10.5px;font-weight:700;background:#000a;border-radius:5px;padding:1px 6px}
.tile .pin{position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.ptile{padding:8px;font-size:11.5px;line-height:1.35;color:var(--mute);text-align:left;overflow:hidden}
.ptile span{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.ghost{display:grid;place-items:center;color:var(--mute);font-size:12px;background:linear-gradient(100deg,var(--raise) 30%,var(--line) 50%,var(--raise) 70%);background-size:220% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-220% 0}}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:18px;color:var(--mute);text-align:center;font-size:14px}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.lcard h3{font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.lcard p{margin:0;color:var(--mute);font-size:13px;flex:1}
.lcard.on{border-color:var(--acc)}
.built{font:600 10.5px var(--body);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);border-radius:999px;padding:1px 7px}
.form{display:flex;flex-direction:column;gap:8px}

/* modal + toast */
#modal:empty{display:none}
#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:40}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(460px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet img{max-height:50vh;max-width:100%;margin:0 auto;border-radius:10px;display:block}
.sheet p{margin:0;color:var(--mute);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--ink);font-weight:600;padding:9px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  html,body{height:auto;min-height:100%}
  body{display:block;padding-bottom:74px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;padding:8px 12px;gap:8px}
  .proj{display:none} .credits{margin-left:auto}
  .rail{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:6px}
  .rail p{display:none}
  .nav{flex-direction:column;gap:3px;font-size:11.5px;padding:6px 10px;min-width:62px;width:auto;align-items:center}
  .stage{overflow:visible;padding:14px 12px}
  .dock{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .hero{padding:3vh 0 1vh}
  .composer{flex-direction:column} .go{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tile video{width:100%;height:100%;object-fit:cover;display:block}
.aud{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;height:100%;padding:8px;color:var(--sound);text-align:center}
.aud svg{width:26px;height:26px}.aud small{color:var(--mute);font-size:11px;line-height:1.3}
.ref video{width:100%;height:100%;object-fit:cover}
.sheet video{max-height:56vh;max-width:100%;margin:0 auto;border-radius:10px;display:block;background:#000}
input[type=number],input[type=password]{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
label.note{display:flex;flex-direction:column;gap:4px}label.note.row{flex-direction:row;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stats b{font:600 24px var(--display);display:block}.stats span{color:var(--mute);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--mute)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff7a7a}
.pill.ok{color:var(--text)}.pill.ok::before{background:var(--create);box-shadow:0 0 8px var(--create)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--raise);margin:10px 0}
.bar i{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--create) 45%,transparent);border-radius:4px}
.bar b{position:absolute;top:-4px;width:3px;height:16px;background:var(--text);border-radius:2px;transform:translateX(-1px)}
.shot{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px}
.ghost0{display:grid;place-items:center;color:var(--mute);font-size:12px;border-style:dashed}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.fgrid select{max-width:none;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body data-mode="create">
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 2h7M10 2v6.2L4.4 18.6A2.3 2.3 0 0 0 6.5 22h11a2.3 2.3 0 0 0 2.1-3.4L14 8.2V2"/><path d="M10.4 12.6l4.4 2.7-4.4 2.7z" fill="var(--acc)" stroke="var(--acc)"/></svg>
    <div><b>Fitz Labs</b><small>AI video generator</small></div>
  </div>
  <div class="proj"><input type="text" id="proj" aria-label="Project name" maxlength="40"></div>
  <button class="credits" data-act="credits" aria-label="Engine and credits"><span id="crl">Credits</span><b id="cr"></b><div class="meter"><i id="crm"></i></div></button>
</header>
<nav class="rail" id="rail" aria-label="Studio"></nav>
<main class="stage" id="stage"></main>
<aside class="dock" id="dock" aria-label="References"></aside>
<div id="modal"></div>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
const LS='fitzlabs.studio.v2', MAXC=12000;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

const PRESETS=[
 ['Selfie','Reframe as a handheld selfie taken by the subject, arm slightly visible, natural phone-camera perspective.'],
 ['Side profile','Turn the subject to a clean 90° side profile, same lighting and setting.'],
 ['Over shoulder','Shoot from behind the subject’s shoulder so the shoulder anchors the foreground and the scene stays readable.'],
 ['From behind','Place the camera behind the subject, showing the back of the head and body facing the scene.'],
 ['Low angle','Drop the camera low and look up at the subject for more presence and scale.'],
 ['Drone view','High aerial view looking down, wide environment, subject still easy to find.'],
 ['Zoom in','Tighter framing on the face and upper body, less background.'],
 ['Zoom out','Wider framing with more environment and breathing room around the subject.'],
 ['Enhance realism','Push photographic realism: natural skin texture, accurate shadows, true lens behavior.'],
 ['Remove background','Remove the background. Change nothing else.'],
 ['Expand margins','Fill in the margins. Do not change anything else.']
].map(([name,prompt],i)=>({id:'b'+i,name,prompt,builtin:true}));
const STYLES=[
 {id:'none',name:'None',prompt:'',builtin:true},
 {id:'s1',name:'Digicam photoreal',prompt:'Early-2000s compact digital camera look, direct flash, slight noise, candid framing, true-to-life color.',builtin:true},
 {id:'s2',name:'Soft storybook',prompt:'Warm storybook illustration, rounded shapes, gentle gradients, friendly expressive characters.',builtin:true},
 {id:'s3',name:'Ink noir cartoon',prompt:'Monochrome ink cartoon, scratchy hand-drawn lines, heavy cross-hatching, tall exaggerated forms, moody shadows.',builtin:true}
];
const TPL=[
 {id:'t25',name:'Hook, demo, proof',why:'The default for selling a product cold. Lands inside the 21–34 second window TikTok reports as best for conversions.',shots:[
  ['Hook',3,'Extreme close-up, fast movement toward camera, the product snaps into frame in the first second.'],
  ['Problem',4,'The person struggles with the everyday problem this product solves, handheld phone footage, natural light.'],
  ['Reveal',4,'Hands unbox or pick up the product, slow push-in, clean background.'],
  ['Demo',6,'The product in use, medium shot, one clear action from start to finish.'],
  ['Proof',4,'The result: before and after side by side, or the person reacting with real relief.'],
  ['Call to action',4,'Product hero shot, steady camera, space at the top for the offer text.']]},
 {id:'t15',name:'Quick product spot',why:'For simple, low-price products and retargeting people who already know you. Cheap to render and to test.',shots:[
  ['Hook',3,'The single most surprising thing the product does, shown in close-up.'],
  ['Demo',5,'The product in use, one continuous action.'],
  ['Benefit',4,'The result on screen, bright and clear.'],
  ['Call to action',3,'Product hero shot with room for the offer text.']]},
 {id:'t31',name:'Story ad',why:'For products that need explaining or cost more. Sits at the top of the conversion window, so every shot has to earn its place.',shots:[
  ['Hook',3,'A bold visual question: the person stops mid-action and looks at camera.'],
  ['Setup',5,'Their normal day, wide shot, establishing who they are.'],
  ['Struggle',5,'The problem gets in the way, closer framing, slight handheld shake.'],
  ['Discovery',4,'They find the product, soft push-in on their face then the product.'],
  ['Demo',6,'Using the product step by step, medium shot.'],
  ['Result',4,'Life after: same scene as the setup, visibly better.'],
  ['Call to action',4,'Product hero shot with room for the offer text.']]},
 {id:'t9',name:'Retargeting bumper',why:'A reminder for warm audiences. Too short to sell cold, good for abandoned carts and limited offers.',shots:[
  ['Hook',2,'Product in motion, hard cut in.'],['Offer',4,'Product hero shot, room for the discount text.'],['Call to action',3,'Hand taps or picks up the product.']]}
];
const NAV=[['dashboard','Dashboard',0],['projects','Projects',0],['create','Create',1],['edit','Edit',1],['video','Video',1],['sound','Sound',1],
 ['media','Media',0,'Libraries'],['chars','Characters',0],['elements','Elements',0],['presets','Presets',0],['styles','Styles',0],['templates','Templates',0,'Studio'],['resources','Resources',0]];
const ICON={create:'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18.5 16.5v4M16.5 18.5h4',edit:'M6 2v16h16M2 6h16v16',video:'M3 6h13v12H3zM16 10l5-3v10l-5-3',sound:'M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4',media:'M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6',chars:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6',presets:'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4',styles:'M12 3a9 9 0 1 0 0 18c1.4 0 2-.9 2-1.9 0-1.1-.6-1.5-.1-2.5.6-1 2-.6 3.6-.6A3.5 3.5 0 0 0 21 12.5 9 9 0 0 0 12 3z',
 dashboard:'M3 3h8v10H3zM13 3h8v6h-8zM13 11h8v10h-8zM3 15h8v6H3z',projects:'M3 7h18v13H3zM3 7l2-3h5l2 3',elements:'M12 2l9 5v10l-9 5-9-5V7zM12 12l9-5M12 12v10M12 12L3 7',templates:'M4 4h16v5H4zM4 12h7v8H4zM14 12h6v8h-6z',resources:'M5 4h14v6H5zM5 14h14v6H5zM8 7h.01M8 17h.01M12 7h4M12 17h4'};
const ico=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[n]}"/></svg>`;

let S={project:'Untitled project',credits:MAXC,view:'dashboard',lastMode:'create',media:[],slots:[],chars:[],elements:[],projects:[],presets:PRESETS,styles:STYLES,
  set:{ratio:'9:16',res:'1K',dur:'5s',chat:false,charOn:false,charId:'',styleId:'none'},editId:'',selChar:'',selProj:'',mfilter:'all'};
const P={create:'',edit:'',video:'',sound:'',chat:''};
let chat=[], busy=false, busyShot='', sample=null, warned=false, live=false, health=null, stats=null, pushT, armed='';
const R={settings:null,offers:null,instances:null,q:{gpu:'RTX 4090',max_price:'0.6',min_vram:'24',spot:'false'},loading:''};

function adopt(d){if(d&&typeof d==='object'&&d.set){S={...S,...d,set:{...S.set,...d.set}};
  for(const k of['media','slots','chars','elements','projects'])if(!Array.isArray(S[k]))S[k]=[];
  if(!Array.isArray(S.presets)||!S.presets.length)S.presets=PRESETS;if(!Array.isArray(S.styles)||!S.styles.length)S.styles=STYLES}}
try{adopt(JSON.parse(localStorage.getItem(LS)||'null'))}catch(e){}
function save(){
  const put=o=>localStorage.setItem(LS,JSON.stringify(o));
  try{put(S)}catch(e){
    try{put({...S,media:S.media.slice(0,10)})}catch(e2){try{put({...S,media:[],slots:[]})}catch(e3){}}
    if(!warned&&!live){warned=true;toast('Storage is full. Older media stays for this session only.')}
  }
  if(live){clearTimeout(pushT);pushT=setTimeout(()=>api('/state',{method:'PUT',body:S}).catch(()=>{}),600)}
}
function toast(t,ms=2800){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),ms)}
const fail=e=>toast(e&&e.message?e.message:'Something went wrong. Try again.',6000);
async function api(path,opt={}){
  const r=await fetch('/api'+path,{method:opt.method||'GET',headers:opt.body?{'Content-Type':'application/json'}:{},body:opt.body?JSON.stringify(opt.body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'The server returned an error ('+r.status+').');return j}
const M=id=>S.media.find(m=>m.id===id);
const isMode=v=>['create','edit','video','sound'].includes(v);
const costOf=k=>k==='video'?(S.set.dur==='10s'?80:40):k==='sound'?6:({'1K':4,'2K':5,'4K':8}[S.set.res]||4);
const canChat=()=>!!sample||(live&&health&&health.hf);
const firstSlot=kind=>S.slots.map(M).find(m=>m&&m.kind===kind);

/* ---------- preview renderer (used only when no engine is connected) ---------- */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
function dims(r){const[a,b]=r.split(':').map(Number),L=720;return a>=b?[L,Math.round(L*b/a)]:[Math.round(L*a/b),L]}
function fit(ctx,img,w,h,contain){const s=(contain?Math.min:Math.max)(w/img.width,h/img.height),dw=img.width*s,dh=img.height*s;ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh)}
function wrapText(ctx,text,maxW,maxLines){const words=text.split(/\s+/),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;if(lines.length===maxLines)break}else cur=t}
  if(lines.length<maxLines&&cur)lines.push(cur);else if(lines.length===maxLines)lines[maxLines-1]=lines[maxLines-1].replace(/.{0,3}$/,'…');return lines}
async function drawFrame(prompt,ratio,baseSrc,kind){
  const[w,h]=dims(ratio),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),r=rng(hash(prompt+kind)),hue=Math.floor(r()*360);
  let base=null;if(baseSrc){try{base=await loadImg(baseSrc)}catch(e){}}
  if(base){
    const t=document.createElement('canvas');t.width=28;t.height=Math.max(8,Math.round(28*h/w));fit(t.getContext('2d'),base,t.width,t.height,false);
    x.imageSmoothingQuality='high';x.drawImage(t,0,0,w,h);x.fillStyle='rgba(5,8,14,.25)';x.fillRect(0,0,w,h);fit(x,base,w,h,kind==='edit');
    const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,`hsla(${hue},80%,60%,.16)`);g.addColorStop(1,`hsla(${(hue+70)%360},80%,45%,.12)`);x.fillStyle=g;x.fillRect(0,0,w,h);
  }else{
    const g=x.createLinearGradient(0,0,w*.4,h);g.addColorStop(0,`hsl(${hue},55%,16%)`);g.addColorStop(1,`hsl(${(hue+50)%360},60%,7%)`);x.fillStyle=g;x.fillRect(0,0,w,h);
    for(let i=0;i<5;i++){const cx=r()*w,cy=r()*h,rad=(.25+r()*.45)*Math.max(w,h),b=x.createRadialGradient(cx,cy,0,cx,cy,rad);
      b.addColorStop(0,`hsla(${(hue+i*38)%360},85%,${50+r()*15}%,.5)`);b.addColorStop(1,'transparent');x.fillStyle=b;x.fillRect(0,0,w,h)}
  }
  const v=x.createLinearGradient(0,h*.55,0,h);v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(0,0,0,.82)');x.fillStyle=v;x.fillRect(0,0,w,h);
  x.font='600 17px Figtree, system-ui, sans-serif';x.fillStyle='#fff';
  const lines=wrapText(x,prompt,w-40,4);lines.forEach((l,i)=>x.fillText(l,20,h-22-(lines.length-1-i)*23));
  x.font='700 12px Figtree, system-ui, sans-serif';const lab=kind==='video'?'Preview clip, no engine connected':'Preview frame, no engine connected';const tw=x.measureText(lab).width+16;
  x.fillStyle='rgba(0,0,0,.6)';x.fillRect(12,12,tw,22);x.fillStyle='#fff';x.fillText(lab,20,27);
  if(kind==='video'){x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.arc(w/2,h/2,38,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(w/2-11,h/2-17);x.lineTo(w/2+19,h/2);x.lineTo(w/2-11,h/2+17);x.fill()}
  return c.toDataURL('image/jpeg',.82);
}
function drawWave(prompt){
  const w=540,h=720,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),r=rng(hash(prompt));
  x.fillStyle='#0b0f1a';x.fillRect(0,0,w,h);const n=46,bw=(w-60)/n;
  for(let i=0;i<n;i++){const a=(.15+r()*.85)*Math.sin(Math.PI*(i+.5)/n)*230+8;x.fillStyle=`hsl(${338+i*.9},95%,${58+r()*10}%)`;x.fillRect(30+i*bw,h*.42-a/2,bw*.6,a)}
  x.font='600 17px Figtree, system-ui, sans-serif';x.fillStyle='#fff';wrapText(x,prompt,w-40,4).forEach((l,i)=>x.fillText(l,20,h-104+i*23));
  x.font='700 12px Figtree, system-ui, sans-serif';x.fillStyle='rgba(255,255,255,.7)';x.fillText('Preview voiceover, no engine connected',20,30);
  return c.toDataURL('image/jpeg',.82);
}

/* ---------- generation ---------- */
async function runJob(body){
  const{id}=await api('/generate',{method:'POST',body});
  for(;;){await wait(2500);const j=await api('/jobs/'+id);if(j.status==='done')return j.media;if(j.status==='error')throw new Error(j.error||'The render failed.')}
}
async function generate(kind,o={}){
  const p=(o.prompt??P[kind]).trim();if(busy)return;if(!p){toast('Write a prompt first');return}
  if(kind==='edit'&&!M(S.editId)){toast('Pick an image to edit first');return}
  const ch=S.set.charOn&&S.chars.find(c=>c.id===S.set.charId),st=S.styles.find(s=>s.id===S.set.styleId),slotImg=firstSlot('image');
  const base=kind==='edit'?M(S.editId):kind==='video'?(slotImg||null):kind==='create'?((ch&&M(ch.refs[0]))||(live?null:slotImg)||null):null;
  let m;
  if(live){
    busy=true;busyShot=o.shot?o.shot.id:'';render();
    const full=p+(kind==='create'&&ch?` The subject is ${ch.name}: ${ch.desc}`:'')+(kind!=='sound'&&st&&st.prompt?` Style: ${st.prompt}`:'');
    const img=base&&base.file&&base.kind==='image'?base.file:'';
    try{m=await runJob({kind:kind==='create'?(img?'edit':'image'):kind,prompt:full,ratio:S.set.ratio,image:img,seconds:o.seconds||parseInt(S.set.dur)});m.prompt=p}
    catch(e){busy=false;busyShot='';render();fail(e);return}
  }else{
    const cost=costOf(kind);if(S.credits<cost){toast('Not enough demo credits. Tap the credits box to refill.');return}
    busy=true;busyShot=o.shot?o.shot.id:'';render();await wait(700);
    const src=kind==='sound'?drawWave(p):await drawFrame(p,S.set.ratio,base&&base.src,kind);
    m={id:uid(),kind:kind==='video'?'video':kind==='sound'?'audio':'image',src,prompt:p,meta:'Preview only'};S.credits-=cost;
  }
  S.media.unshift(m);if(kind==='edit')S.editId=m.id;if(o.shot)o.shot.mediaId=m.id;busy=false;busyShot='';save();render();
  toast(live?'Render added to your reference grid':'Preview added. Connect an engine on the Resources page for real renders.',live?2800:4500);
}
async function addFiles(files){
  for(const f of files){
    try{
      if(live){const fd=new FormData();fd.append('file',f);const r=await fetch('/api/upload',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.detail);S.media.unshift(j);continue}
      if(!f.type.startsWith('image/')){toast('Video and audio uploads need the self-hosted server.');continue}
      const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)});
      const img=await loadImg(url),s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.media.unshift({id:uid(),kind:'image',src:c.toDataURL('image/jpeg',.85),prompt:'',meta:'Uploaded: '+f.name});
    }catch(e){toast('Couldn’t add '+f.name)}}
  save();render();
}
async function sendChat(){
  const t=P.chat.trim();if(!t||busy||!canChat())return;
  chat.push({role:'user',text:t},{role:'assistant',text:''});P.chat='';busy=true;render();
  const ch=S.set.charOn&&S.chars.find(c=>c.id===S.set.charId),st=S.styles.find(s=>s.id===S.set.styleId);
  const sys='You write prompts for an AI image and video generator. Turn the request into one vivid, production-ready prompt of 60 to 110 words covering subject, wardrobe, setting, lighting, lens and mood. When asked for a change, rewrite the whole prompt with that change. Reply with the prompt only, no preamble or quotes.'
    +(ch?`\nThe main character is ${ch.name}: ${ch.desc}`:'')+(st&&st.prompt?`\nVisual style to follow: ${st.prompt}`:'');
  const turns=chat.slice(0,-1),last=chat[chat.length-1];
  try{
    if(sample){const r=await sample(turns.map((m,i)=>({role:m.role,content:i===0?sys+'\n\nRequest: '+m.text:m.text})),{cache:false,modelTier:'quick',onText:({text})=>{last.text=text;const b=$('live');if(b)b.textContent=text}});last.text=r.text}
    else last.text=(await api('/chat',{method:'POST',body:{messages:[{role:'system',content:sys},...turns.map(m=>({role:m.role,content:m.text}))]}})).text;
  }catch(e){last.err=e&&e.code==='not_granted'?'Chat mode needs permission to ask Claude.':e&&e.code==='rate_limited'?'Too many requests. Wait a moment, then send again.':'That prompt didn’t come through. '+(e&&e.message&&!e.code?e.message:'Send it again.');if(e&&e.text)last.text=e.text}
  busy=false;render();const th=document.querySelector('.thread');if(th)th.scrollTop=th.scrollHeight;
}

function sel(key,opts,label){const v=S.set[key];return`<label>${label}<select data-set="${key}">${opts.map(o=>{const[val,txt]=Array.isArray(o)?o:[o,o];return`<option value="${esc(val)}"${val===v?' selected':''}>${esc(txt)}</option>`}).join('')}</select></label>`}
function thumb(m){
  if(m.file&&m.kind==='video')return`<video src="${esc(m.src)}#t=0.1" muted playsinline preload="metadata"></video>`;
  if(m.file&&m.kind==='audio')return`<span class="aud">${ico('sound')}<small>${esc((m.prompt||'Sound').slice(0,60))}</small></span>`;
  return`<img src="${esc(m.src)}" alt="${esc(m.prompt||m.meta||'Media')}" loading="lazy">`}
function tile(m,act='open'){
  const pin=S.slots.includes(m.id)?'<i class="pin" title="In quick slots"></i>':'';
  if(m.kind==='prompt')return`<button class="tile ptile" data-act="${act}" data-id="${m.id}"><span>${esc(m.prompt)}</span>${pin}</button>`;
  const tag=m.kind==='video'?'<span class="tag">Video</span>':m.kind==='audio'?'<span class="tag">Sound</span>':'';
  return`<button class="tile" data-act="${act}" data-id="${m.id}">${thumb(m)}${tag}${pin}</button>`;
}

  addshot(){curProj().shots.push({id:uid(),label:'New shot',sec:4,prompt:'',mediaId:''});save();render()},
  delshot(d){const p=curProj();p.shots=p.shots.filter(s=>s.id!==d.id);save();render()},
  slotshot(d){const s=curProj().shots.find(x=>x.id===d.id),m=S.slots.map(M).find(x=>x&&(x.kind==='video'||x.kind==='image'));if(!m){toast('Pin a clip or image to quick slots first');return}s.mediaId=m.id;save();render()},
  genshot(d){const s=curProj().shots.find(x=>x.id===d.id);generate('video',{prompt:s.prompt,shot:s,seconds:Math.max(5,Math.ceil(s.sec))})},
  async stitch(){const p=curProj(),shots=p.shots.map(s=>({m:M(s.mediaId),s})).filter(x=>x.m&&x.m.file).map(x=>({file:x.m.file,seconds:+x.s.sec||4})),aud=firstSlot('audio');
    busy=true;busyShot='stitch';render();
    try{const m=await api('/stitch',{method:'POST',body:{shots,ratio:S.set.ratio,audio:aud&&aud.file?aud.file:'',name:p.name}});S.media.unshift(m);busy=false;busyShot='';save();render();openMedia(m)}
    catch(e){busy=false;busyShot='';render();fail(e)}},
  credits(){if(live){A.go({view:'resources'});return}$('modal').innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Demo credits"><h2>Demo credits</h2><p>${S.credits.toLocaleString()} of ${MAXC.toLocaleString()} left. They only meter preview frames. Once the server is connected, this box shows your engine instead and real costs appear on the Dashboard.</p><div class="row"><button class="btn pri" data-act="refill">Refill credits</button><button class="btn" data-act="close">Close</button></div></div>`},
  refill(){S.credits=MAXC;save();closeModal();render();toast('Credits refilled')},
  reload(){loadRes()}, offers(){loadRes('offers')},
  async savecfg(){const body={};document.querySelectorAll('[data-cfg]').forEach(el=>{body[el.dataset.cfg]=el.value.trim()});
    try{R.settings=await api('/settings',{method:'POST',body});health=await api('/health');render();toast('Settings saved')}catch(e){fail(e)}},
  async rent(d){try{const r=await api('/vast/rent',{method:'POST',body:{offer_id:+d.id,price:R.q.spot==='true'&&d.price?+d.price*1.1:null}});toast('Rented. Instance '+(r.new_contract||'')+' is starting; it takes a few minutes.',6000);R.offers=null;loadRes('instances')}catch(e){fail(e)}},
  async inst(d){try{const r=await api(`/vast/instances/${d.id}/${d.do}`,{method:'POST'});toast(d.do==='use'?'Renders now go to '+r.comfy_url:d.do==='stop'?'Stopping the instance':'Starting the instance',4000);loadRes()}catch(e){fail(e)}},
  async destroy(d){if(armed!=d.id){armed=d.id;render();setTimeout(()=>{if(armed==d.id){armed='';if(S.view==='resources')render()}},4000);return}armed='';
    try{await api('/vast/instances/'+d.id,{method:'DELETE'});toast('Instance destroyed');loadRes()}catch(e){fail(e)}}
};
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const b=e.target.closest('[data-act]');if(b&&!b.disabled&&A[b.dataset.act])A[b.dataset.act](b.dataset);
});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
  if(d.p)P[d.p]=t.value;
  else if(d.char){const c=S.chars.find(x=>x.id===S.selChar);if(c){c[d.char]=t.value;save()}}
  else if(d.shot){const s=curProj()&&curProj().shots.find(x=>x.id===d.shot);if(s){s[d.f]=d.f==='sec'?Math.max(1,Math.min(10,parseFloat(t.value)||1)):t.value;save()}}
  else if(d.proj){const p=curProj();if(p){p.name=t.value;save()}}
  else if(d.rq)R.q[d.rq]=t.value;
  else if(t.id==='proj'){S.project=t.value;save()}
});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.set){S.set[d.set]=t.value;save();render()}
  else if(d.char==='name'||d.f==='sec')render();
  else if(t.id==='file'){addFiles([...t.files]);t.value=''}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chatin'){e.preventDefault();sendChat()}
});
render();
(async()=>{ // connect to the self-hosted server when this page is served by it
  try{const c=new AbortController();setTimeout(()=>c.abort(),2500);const r=await fetch('/api/health',{signal:c.signal});const h=await r.json();
    if(r.ok&&h.app==='fitzlabs'){health=h;live=true;adopt(await api('/state'));render();loadStats();if(S.view==='resources')loadRes()}}catch(e){}
})();
if(window.claude&&typeof window.claude.use==='function'){
  Promise.resolve(window.claude.use('sample')).then(s=>{if(s){sample=s;render()}}).catch(()=>{});
}
</script>
</body>
</html>
